name: Unit tests

on:
    push:
        branches:
            - 'main'
    pull_request:
        branches:
            - 'main'
jobs:
    compile_test:
        runs-on: ubuntu-slim
        name: 'compiles and executes unit tests'
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-java@v6
              with:
                distribution: temurin
                java-version: '17'
                java-package: 'jdk'
            - run: ./mvnw --batch-mode clean test
    