name: Unit tests

on:
    push:
        branches:
            - 'main'
    pull_request:
        branches:
            - 'main'
jobs:
    compile_test:
        runs-on: ubuntu-slim
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: '17'    
            - name: Build and test server
              working-directory: kvstore-server
              run: ./mvnw --batch-mode clean test
            - name: Build and test client
              working-directory: kvstore-client
              run: ./mvnw --batch-mode clean test

    
